name: Horar integration acceptance

on:
  pull_request:
  push:
    branches: [main, "qa/**", "fix/**"]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci
      - name: Run every JS regression / acceptance test
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install browser test engines
        run: npx playwright install --with-deps chromium webkit
      - name: Mobile browser acceptance with real WASM and offline cache
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
